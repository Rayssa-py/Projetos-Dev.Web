<!DOCTYPE html>
<html>
    <head>
        <title>CADASTRO DE USUÁRIO</title>
    </head>
    <body>
        <header>
            <h1>Cadastro do usuário</h1>
            <nav>
                <ul>
                    <li><a href="Projetos-Dev.Web/Projeto1/index.html">Sobre mim</a></li>
                    <li><a href="Projetos-Dev.Web/Projeto2/index.html">Portfólio</a></li>
                    <li><a href="Projetos-Dev.Web/Projeto3/index.html">Receita de pudim</a></li>
                </ul>
            </nav>
        </header>
        
        <h2>Formulário de Cadastro</h2>
        <form action="/dados" method="post">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha" required><br><br>

            <label for="genero">Gênero: </label>
            <select id="genero" name="genero" required>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
            </select><br><br>

            <label for="interesses">Interesses: </label><br>
            <input type="checkbox" id="interesse1" name="interesses" value="tecnologia">
            <label for="interesse1">Tecnologia</label><br>
            <input type="checkbox" id="interesse2" name="interesses" value="design">
            <label for="interesse2">Design</label><br>
            <input type="checkbox" id="interesse3" name="interesses" value="esportes">
            <label for="interesse3">Esportes</label><br><br>

            <label for="biografia">Biografia:  </label><br>
            <textarea id="biografia" name="biografia" rows="5" cols="50"></textarea><br><br>

            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </body>
</html>
